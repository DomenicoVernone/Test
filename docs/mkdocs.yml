site_name: Clinical Twin — FTD Radiomics Platform

theme:
  name: material
  language: en
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: it
          name: Italiano
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Introduction: index.md

  - Architecture:
      - System Architecture: SYSTEM_ARCHITECTURE.md
      - Components & Structure: COMPONENTS_&_STRUCTURE.md

  - Setup:
      - Installation: Installazione.md
      - Configuration: Configurazione.md

  - Pipeline:
      - Radiomics Pipeline: Pipeline_doc.md

  - Usage:
      - Quickstart: Guida_Rapida.md

  - API:
      - API Reference: api.md

  - Deployment:
      - Deployment Guide: Deployment.md

  - Testing:
      - Test Plan & Results: testing.md

  - Reports:
      - Technical Report (Session): REPORT_FINALE_COMPLETO.md
      - Changelog & Performance: CHANGES_AND_PERFORMANCE.md
