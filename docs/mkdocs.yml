site_name: MLOps — FTD Radiomics Platform

theme:
  name: material
  language: en
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: it
          name: Italiano
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Introduction: index.md

  - Architecture:
      - System Architecture: architettura.md
      - Components & Structure: struttura_componenti.md

  - Setup:
      - Installation: installazione.md
      - Configuration: configurazione.md

  - Pipeline:
      - Radiomics Pipeline: pipeline.md

  - Usage:
      - Quickstart: guida_rapida.md

  - API:
      - API Reference: api_reference.md
      - API Security:
          - Summary: security_summary.md
          - Code Changes: security_code_changes.md
          - Tests: security_tests.md
      - Sicurezza API:
          - Riepilogo: sicurezza_riepilogo.md
          - Modifiche al codice: sicurezza_modifiche_codice.md
          - Test eseguiti: sicurezza_test.md

  - Deployment:
      - Deployment Guide: deployment.md

  - Testing:
      - Test Plan & Results: testing.md

  - Reports:
      - Technical Report: report_tecnico.md
      - Changelog & Performance: changelog.md
      - API Security Report: sicurezza_api.md
